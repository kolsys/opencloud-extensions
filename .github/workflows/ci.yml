name: ci

on:
  push:
    branches: [master]
    tags: ["v*"]
  pull_request:

env:
  GO_VERSION: "1.26"
  NODE_VERSION: "22"
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  # The repository is a workspace of three modules and the root is not one,
  # so every job walks them in turn.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: for m in common video-thumbnails file-activity; do (cd "$m" && go test ./...) || exit 1; done

  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [common, video-thumbnails, file-activity]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.10.1
          working-directory: ${{ matrix.module }}

  lint-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: for s in */api/openapi.yaml; do npx --yes @redocly/cli@latest lint "$s" || exit 1; done

  # The web app of video-thumbnails; the image builds it again on its own.
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: video-thumbnails/web-app/package-lock.json
      - run: npm ci && npm run check && npm run build
        working-directory: video-thumbnails/web-app

  # One manifest per extension covering amd64 and arm64, pushed on a tag.
  # The go and node stages cross compile on the runner, so only the final
  # alpine layer comes from the target platform.
  images:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, lint, web]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        extension: [video-thumbnails, file-activity]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          # The build context is the root of the repository: every extension
          # is built together with the common module.
          context: .
          file: ${{ matrix.extension }}/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          build-args: VERSION=${{ github.ref_name }}
          tags: ghcr.io/${{ github.repository }}/${{ matrix.extension }}:${{ github.ref_name }}
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
